<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Sier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "DM Sans", sans-serif;
        font-synthesis: none;
        --ink: #181817;
        --paper: #f2f0e9;
        --orange: #f05a28;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: var(--paper);
      }

      body {
        color: var(--ink);
      }

      a {
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      .page {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        background: var(--paper);
      }

      .noise {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.18;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
        mix-blend-mode: multiply;
      }

      .header,
      .content {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
        padding-right: 3rem;
        padding-left: 3rem;
      }

      .header {
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 2rem;
        padding-bottom: 2rem;
      }

      .logo {
        font-size: 1.75rem;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.08em;
        text-decoration: none;
      }

      .logo-mark {
        color: var(--orange);
      }

      .eyebrow,
      .footer {
        font-size: 0.6875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }

      .eyebrow {
        color: rgb(0 0 0 / 45%);
      }

      .contact-link {
        display: inline-flex;
        gap: 0.5rem;
        align-items: center;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration-color: rgb(0 0 0 / 25%);
        text-underline-offset: 0.25rem;
        transition: text-decoration-color 180ms ease;
      }

      .contact-link:hover {
        text-decoration-color: var(--ink);
      }

      .icon {
        width: 1rem;
        height: 1rem;
        flex: 0 0 auto;
      }

      .content {
        display: flex;
        min-height: calc(100dvh - 92px);
        flex-direction: column;
        justify-content: center;
        padding-bottom: 2.5rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 0.44fr);
        gap: 4rem;
        align-items: end;
      }

      .code-wrap {
        position: relative;
      }

      .orange-shape {
        position: absolute;
        top: 5%;
        left: 7%;
        width: 44%;
        height: 72%;
        transform: rotate(-10deg);
        border-radius: 50%;
        background: var(--orange);
        filter: blur(1px);
      }

      .status {
        position: absolute;
        z-index: 10;
        top: 0.5rem;
        left: 0.5rem;
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin: 0;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }

      .status::before {
        width: 2rem;
        height: 1px;
        content: "";
        background: currentcolor;
      }

      .error-code {
        position: relative;
        z-index: 10;
        color: transparent;
        font-size: clamp(10rem, 38vw, 36rem);
        font-weight: 600;
        line-height: 0.72;
        letter-spacing: -0.1em;
        user-select: none;
        -webkit-text-stroke: 2px var(--ink);
        paint-order: stroke fill;
        animation: code-in 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .message {
        max-width: 28rem;
        padding-bottom: 3rem;
      }

      h1 {
        margin: 0;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(2.8rem, 5vw, 5.4rem);
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.045em;
      }

      h1 em {
        color: var(--orange);
        font-weight: 400;
      }

      .description {
        max-width: 24rem;
        margin: 1.5rem 0 0;
        color: rgb(0 0 0 / 60%);
        font-size: 1.125rem;
        line-height: 1.625;
      }

      .home-button {
        display: inline-flex;
        gap: 0.75rem;
        align-items: center;
        margin-top: 2rem;
        padding: 0.875rem 1.5rem;
        border-radius: 999px;
        background: var(--ink);
        color: white;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition:
          background-color 300ms ease,
          transform 300ms ease;
      }

      .home-button:hover {
        background: var(--orange);
      }

      .home-button .icon {
        transition: transform 300ms ease;
      }

      .home-button:hover .icon {
        transform: translateX(0.25rem);
      }

      .home-button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
      }

      .footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin-top: 1rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgb(0 0 0 / 15%);
        color: rgb(0 0 0 / 45%);
        letter-spacing: 0.16em;
      }

      .orbit {
        position: absolute;
        right: -18rem;
        bottom: -23rem;
        width: 46rem;
        height: 46rem;
        border: 1px solid rgb(0 0 0 / 15%);
        border-radius: 50%;
        animation: orbit 18s linear infinite;
      }

      .orbit-dot {
        position: absolute;
        top: 12%;
        left: 12%;
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 50%;
        background: var(--orange);
      }

      @keyframes code-in {
        from {
          opacity: 0;
          transform: translateY(28px);
          letter-spacing: -0.16em;
        }

        to {
          opacity: 1;
          transform: translateY(0);
          letter-spacing: -0.1em;
        }
      }

      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 1023px) {
        .header,
        .content {
          padding-right: 2rem;
          padding-left: 2rem;
        }

        .layout {
          grid-template-columns: 1fr;
          gap: 3rem;
        }

        .status {
          position: relative;
          top: auto;
          left: auto;
          margin-bottom: 1rem;
        }

        .message {
          padding-bottom: 0.5rem;
        }

        .footer {
          margin-top: 3.5rem;
        }
      }

      @media (max-width: 639px) {
        .header,
        .content {
          padding-right: 1.25rem;
          padding-left: 1.25rem;
        }

        .header {
          padding-top: 1.5rem;
          padding-bottom: 1.5rem;
        }

        .eyebrow,
        .footer-center {
          display: none;
        }

        .error-code {
          -webkit-text-stroke-width: 1.5px;
        }

        .description {
          font-size: 1rem;
        }

        .orbit {
          right: -18rem;
          bottom: -18rem;
          width: 34rem;
          height: 34rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .error-code,
        .orbit {
          animation: none;
        }

        .home-button,
        .home-button .icon {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="noise" aria-hidden="true"></div>

      <header class="header">
        <a class="logo" href="/" aria-label="Sier, go to homepage">
          sier<span class="logo-mark">.</span>
        </a>

        <span class="eyebrow">Error 404</span>

        <a class="contact-link" href="mailto:hampus@sier.se">
          Contact me
          <svg
            class="icon"
            aria-hidden="true"
            fill="none"
            viewBox="0 0 16 16"
          >
            <path
              d="M3.5 12.5 12 4m0 0H5.5M12 4v6.5"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
            />
          </svg>
        </a>
      </header>

      <section class="content">
        <div class="layout">
          <div class="code-wrap">
            <div class="orange-shape" aria-hidden="true"></div>
            <p class="status">Page not found</p>
            <div class="error-code" aria-label="404">404</div>
          </div>

          <div class="message">
            <h1>This page took<br />a wrong <em>turn.</em></h1>

            <p class="description">
              The page you’re looking for has moved, disappeared, or may never
              have existed. Let’s get you back on track.
            </p>

            <a class="home-button" href="/">
              Back to homepage
              <svg
                class="icon"
                aria-hidden="true"
                fill="none"
                viewBox="0 0 16 16"
              >
                <path
                  d="M3.5 12.5 12 4m0 0H5.5M12 4v6.5"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                />
              </svg>
            </a>
          </div>
        </div>

        <footer class="footer">
          <span>© <span id="year"></span> Sier</span>
          <span class="footer-center">ERROR 404</span>
          <span>All rights reserved</span>
        </footer>
      </section>

      <div class="orbit" aria-hidden="true">
        <span class="orbit-dot"></span>
      </div>
    </main>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
