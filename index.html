	<title>Under Construction</title>
	<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #f3f3f3;
}

.container {
  text-align: center;
}

h1 {
  font-size: 2em;
  color: #333;
}

p {
  font-size: 1.2em;
  color: #666;
}

.artcraft-launcher {
  --item-size: 52px;
  --item-gap: 8px;
  position: fixed;
  z-index: 1000;
  top: 20px;
  right: 20px;
  width: var(--item-size);
  height: var(--item-size);
  font-family: Arial, sans-serif;
}

.artcraft-trigger {
  width: var(--item-size);
  height: var(--item-size);
  border-radius: 13px;
}

.artcraft-trigger {
  position: relative;
  z-index: 20;
  display: grid;
  box-sizing: border-box;
  padding: 11px;
  place-items: center;
  border: 1px solid rgba(0, 0, 0, 0.11);
  cursor: pointer;
  background: rgba(255, 255, 255, 0.96);
  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.15),
    0 1px 2px rgba(0, 0, 0, 0.08);
  transition:
    transform 180ms ease,
    box-shadow 180ms ease;
}

.artcraft-trigger:hover {
  transform: translateY(-1px);
  box-shadow:
    0 11px 30px rgba(0, 0, 0, 0.18),
    0 1px 2px rgba(0, 0, 0, 0.08);
}

.artcraft-trigger img {
  display: block;
  width: 31px;
  height: 28px;
}

.artcraft-apps {
  position: absolute;
  top: 0;
  right: 0;
  width: var(--item-size);
  height: var(--item-size);
  pointer-events: none;
}

.artcraft-app {
  position: absolute;
  top: 0;
  right: calc(var(--item-gap) * -1);
  display: block;
  width: calc(var(--item-size) + var(--item-gap));
  height: var(--item-size);
  transform: translateX(calc(var(--app-index) * -2px)) rotate(calc((var(--app-index) - 3) * 1deg));
  opacity: 0;
  pointer-events: none;
  text-decoration: none;
  transition:
    transform 340ms cubic-bezier(0.22, 1, 0.36, 1),
    opacity 130ms ease;
  transition-delay: calc((8 - var(--app-index)) * 12ms);
}

.artcraft-app img {
  display: block;
  width: var(--item-size);
  height: var(--item-size);
  object-fit: contain;
  filter: drop-shadow(0 7px 9px rgba(0, 0, 0, 0.2));
  transition: transform 160ms ease;
}

.artcraft-app span,
.artcraft-trigger-label {
  position: absolute;
  top: calc(100% + 8px);
  padding: 5px 7px;
  border-radius: 5px;
  color: #fff;
  background: rgba(24, 24, 24, 0.92);
  font-size: 10px;
  line-height: 1;
  white-space: nowrap;
  opacity: 0;
  transform: translate(-50%, -3px);
  pointer-events: none;
  transition:
    opacity 120ms ease,
    transform 120ms ease;
}

.artcraft-app span {
  left: calc(var(--item-size) / 2);
}

.artcraft-trigger-label {
  left: 50%;
  opacity: 1;
  transform: translateX(-50%);
}

.artcraft-launcher:hover .artcraft-trigger-label,
.artcraft-launcher:has(.artcraft-app:focus-visible) .artcraft-trigger-label,
.artcraft-launcher.is-pinned-open .artcraft-trigger-label {
  opacity: 0;
  transform: translate(-50%, -3px);
}

.artcraft-launcher:hover .artcraft-apps,
.artcraft-launcher:has(.artcraft-app:focus-visible) .artcraft-apps,
.artcraft-launcher.is-pinned-open .artcraft-apps {
  pointer-events: auto;
}

.artcraft-launcher:hover .artcraft-app,
.artcraft-launcher:has(.artcraft-app:focus-visible) .artcraft-app,
.artcraft-launcher.is-pinned-open .artcraft-app {
  transform: translateX(
    calc((var(--app-index) + 1) * (var(--item-size) + var(--item-gap)) * -1)
  );
  opacity: 1;
  pointer-events: auto;
  transition-delay: calc(var(--app-index) * 25ms);
}

.artcraft-app:hover img,
.artcraft-app:focus-visible img {
  transform: translateY(-4px) scale(1.04);
}

.artcraft-app:hover span,
.artcraft-app:focus-visible span {
  opacity: 1;
  transform: translate(-50%, 0);
}

.artcraft-trigger:focus-visible,
.artcraft-app:focus-visible {
  outline: 3px solid #4e7bfb;
  outline-offset: 3px;
}

@media (max-width: 620px) {
  .artcraft-launcher {
    --item-gap: 3px;
    --item-size: min(42px, calc((100vw - 51px) / 10));
    top: 12px;
    right: 12px;
  }

  .artcraft-trigger {
    padding: 8px;
    border-radius: 11px;
  }

  .artcraft-trigger img {
    width: 26px;
    height: 24px;
  }

  .artcraft-app {
    border-radius: 10px;
  }

  .artcraft-app span {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .artcraft-trigger,
  .artcraft-app,
  .artcraft-app img,
  .artcraft-app span {
    transition-duration: 0.01ms;
  }
}

	</style>

	<script>
		(() => {
			const launcher = document.querySelector('.artcraft-launcher');
			const trigger = launcher.querySelector('.artcraft-trigger');

			const setOpen = (open) => {
				launcher.classList.toggle('is-pinned-open', open);
				trigger.setAttribute('aria-expanded', String(open));
				trigger.setAttribute('aria-label', open ? 'Close ArtCraft apps' : 'Open ArtCraft apps');
			};

			trigger.addEventListener('click', () => {
				setOpen(!launcher.classList.contains('is-pinned-open'));
			});

			document.addEventListener('pointerdown', (event) => {
				if (!launcher.contains(event.target)) setOpen(false);
			});

			document.addEventListener('keydown', (event) => {
				if (event.key === 'Escape' && launcher.classList.contains('is-pinned-open')) {
					setOpen(false);
					trigger.focus();
				}
			});
		})();
	</script>
